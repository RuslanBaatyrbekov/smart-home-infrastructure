# HA и Music Assistant работают в host-сети: так работают mDNS-обнаружение,
# Chromecast/DLNA-колонки, Wi-Fi-розетки и потоковый звук на комод.
# Wyoming-сервисы (STT/TTS/wake word) остаются в bridge, HA ходит к ним через 127.0.0.1.

networks:
  smart-home:
    driver: bridge

services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    network_mode: host
    volumes:
      - ./ha_config:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Europe/Berlin
    restart: unless-stopped
    depends_on:
      - whisper
      - piper
      - openwakeword

  esphome:
    container_name: esphome
    image: ghcr.io/esphome/esphome
    volumes:
      - ./esphome_config:/config
    environment:
      - TZ=Europe/Berlin
    restart: unless-stopped
    ports:
      - "6052:6052"
    networks:
      - smart-home

  whisper:
    container_name: whisper
    image: rhasspy/wyoming-whisper
    # tiny слишком часто ошибается на русском, small-int8 - разумный компромисс по CPU
    command: --model small-int8 --language ru --beam-size 1
    volumes:
      - ./whisper_data:/data
    restart: unless-stopped
    ports:
      - "10300:10300"
    networks:
      - smart-home

  piper:
    container_name: piper
    image: rhasspy/wyoming-piper
    command: --voice ru_RU-ruslan-medium
    volumes:
      - ./piper_data:/data
    restart: unless-stopped
    ports:
      - "10200:10200"
    networks:
      - smart-home

  openwakeword:
    container_name: openwakeword
    image: rhasspy/wyoming-openwakeword
    volumes:
      - ./wyoming:/data
    restart: unless-stopped
    ports:
      - "10400:10400"
    networks:
      - smart-home

  music-assistant:
    container_name: mass
    image: ghcr.io/music-assistant/server:latest
    network_mode: host
    volumes:
      - ./mass_data:/data
    restart: unless-stopped
